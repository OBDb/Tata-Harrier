generations:
  - name: "First Generation"
    start_year: 2019
    end_year: 2023
    description: "The Tata Harrier is a five-seater, diesel-engined compact crossover SUV produced by the Indian automaker Tata Motors Limited. Launched on 23 January 2019, it is positioned between the subcompact Tata Nexon and the mid-size Tata Safari. Based on the OmegaArc platform (an essentially re-engineered version of the Jaguar Land Rover D8 platform), the Harrier features distinctive styling based on Tata's Impact Design 2.0 philosophy with split headlamp configuration, a prominent grille, flared wheel arches, and a floating roof effect. Powered by a 2.0-liter Multijet/Kryotec turbocharged diesel engine producing 140 horsepower and 350 Nm of torque, paired with a six-speed manual transmission. The interior features an 8.8-inch touchscreen infotainment system with Android Auto and a 7-inch TFT instrument cluster display. Safety features include six airbags, ESP stability control, and traction control. Three driving modes (Eco, City, Sport) and a Terrain Response System with Normal, Wet, and Rough modes are offered. In October 2019, the Dark edition was launched with black interiors and exteriors. Production started in October 2018 at Tata's Pune plant."
  - name: "First Generation (Facelift)"
    start_year: 2023
    end_year: null
    description: "The Tata Harrier facelift was revealed alongside the Safari facelift on 6 October 2023. The updated model features exterior and interior design revisions along with enhanced technology features including a new 10.25-inch touchscreen infotainment system, 7-inch digital instrument cluster, 360-degree surround view camera, and ADAS semi-autonomous driving functionalities. A new Red Dark edition was introduced with red interior and red accents on the front grille. The mechanical specifications remain unchanged, continuing with the 2.0-liter turbo diesel engine and front-wheel drive layout. The Harrier continues to be built on the OmegaArc platform derived from the Jaguar Land Rover D8 architecture. An all-electric Harrier EV version was showcased and is set to go into production."